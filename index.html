<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fakir SEO İçerik Oluşturucu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --blue:#5887DA;--blue-d:#3E6CC0;--tint:#EEF1FA;--tint2:#F6F7FC;--line:#E7EBF9;
  --ink:#101820;--gray:#898A8D;--warn:#B85A16;--warn-bg:#FDF1E8;--ok:#3F8F5A;
  --bg:#F6F7FC;--panel:#FFFFFF;--code-bg:#101820;--code-ink:#E7EBF9;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--tint:#1E2740;--tint2:#171D2E;--line:#2A3350;--ink:#EEF1FA;--gray:#9CA3B4;--warn:#F0A36B;--warn-bg:#3A2716;--bg:#0F1320;--panel:#161B2B;--code-bg:#0A0D16}
}
:root[data-theme="dark"]{--tint:#1E2740;--tint2:#171D2E;--line:#2A3350;--ink:#EEF1FA;--gray:#9CA3B4;--warn:#F0A36B;--warn-bg:#3A2716;--bg:#0F1320;--panel:#161B2B;--code-bg:#0A0D16}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top-l{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--blue);background:var(--tint2)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--gray)}
.btn-ghost:hover{color:var(--ink);background:var(--tint2);border-color:transparent}
.seg{display:inline-flex;background:var(--tint);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--gray);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,32,.08)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;padding:28px;max-width:1680px;margin:0 auto}
.form{display:flex;flex-direction:column;gap:20px;min-width:0}
.block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.block>h2{margin:0 0 4px;font-size:15px;font-weight:700}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.block-head h2{margin:0;font-size:15px;font-weight:700}
.count{font-size:13px;color:var(--gray)}
.hint{font-size:12.5px;color:var(--gray);margin:0 0 12px}
.hint code{font-family:var(--mono);font-size:12px;background:var(--tint);padding:1px 5px;border-radius:4px}
.row{display:flex;gap:10px;margin-bottom:12px}
.row:last-child{margin-bottom:0}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field.narrow{flex:0 0 120px}
.field label{font-size:13px;font-weight:600;color:var(--gray)}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
select{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gray) 50%),linear-gradient(135deg,var(--gray) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;font-weight:600}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(88,135,218,.15)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:4px}
.check input{width:16px;height:16px;accent-color:var(--blue)}

.list{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--tint2)}
.card-top{display:flex;align-items:flex-start;gap:10px}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:5px}
.card-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.card-fields .hrow{display:flex;gap:8px}
.card-fields .hrow select{flex:0 0 118px}
.card-fields input{font-weight:600}
.tools{display:flex;flex-direction:column;gap:2px}
.icon-btn{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:var(--gray);display:grid;place-items:center}
.icon-btn:hover{background:var(--tint);color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.icon-btn.del:hover{color:#C43D3D}
.icon-btn svg{width:16px;height:16px}
.warns{list-style:none;margin:8px 0 0 38px;padding:0;display:flex;flex-direction:column;gap:4px}
.warns:empty{display:none}
.warns li{font-size:12.5px;color:var(--warn);background:var(--warn-bg);padding:5px 9px;border-radius:7px}
.add{width:100%;margin-top:12px;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:11px;font-weight:600;color:var(--blue)}
.add:hover{border-color:var(--blue);background:var(--tint2)}

.out{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:14px;min-width:0}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pane[hidden]{display:none}
.pane-scroll{max-height:calc(100vh - 150px);overflow:auto}
.code{margin:0;padding:18px 20px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;max-height:calc(100vh - 220px);overflow:auto}
.code-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.status{font-size:13px;color:var(--gray)}
.status b{color:var(--ink)}
.copied{background:var(--ok)!important;border-color:var(--ok)!important}

.outline{padding:20px}
.outline h3{margin:0 0 12px;font-size:14px}
.ol{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:6px}
.ol li{display:flex;align-items:baseline;gap:10px;font-size:14px}
.ol .tag{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--tint);color:var(--blue)}
.ol .tag.h1{background:var(--blue);color:#fff}
.ol-empty{color:var(--gray);font-size:14px}
.owarn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.owarn li{font-size:13px;color:var(--warn);background:var(--warn-bg);padding:8px 11px;border-radius:8px}
.owarn li.ok{color:var(--ok);background:rgba(63,143,90,.1)}

.pv{padding:8px 4px 32px;background:#fff;color:#101820;font-family:"Poppins",var(--font)}
.pv-empty{padding:60px 24px;text-align:center;color:#898A8D}

dialog{border:1px solid var(--line);border-radius:16px;padding:0;width:min(720px,calc(100% - 32px));background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(16,24,32,.45)}
.dlg{padding:22px}
.dlg h2{margin:0 0 6px;font-size:17px}
.dlg p{margin:0 0 14px;color:var(--gray);font-size:13.5px}
.dlg textarea{min-height:260px;font-family:var(--mono);font-size:12.5px;background:var(--tint2)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dlg-err{color:#C43D3D;font-size:13px;margin-top:8px;min-height:1em}

@media (max-width:1100px){
  .layout{grid-template-columns:1fr}
  .out{position:static}
  .pane-scroll,.code{max-height:none}
}
@media (max-width:640px){
  .top{padding:14px 16px}
  .layout{padding:16px;gap:20px}
  .row{flex-direction:column}
  .field.narrow{flex:1}
  .warns{margin-left:0}
  .card-fields .hrow{flex-direction:column}
  .card-fields .hrow select{flex:1}
}

/* ===== Önizleme: sitedeki CSS ile birebir aynı ===== */
/* ===== Fakir SEO içerik: ortak ===== */
.fk-faq,.fk-cat-seo{--fk-blue:#5887DA;--fk-blue-d:#3E6CC0;--fk-tint:#EEF1FA;--fk-line:#E7EBF9;--fk-line-2:#DCE3F5;--fk-ink:#101820;--fk-text:#4A4F57;--fk-gray:#898A8D;--fk-bg:#FFFFFF}

/* ===== SSS ===== */
.fk-faq{counter-reset:fkfaq;max-width:1600px;margin:48px auto;padding:0 16px;box-sizing:border-box;font-family:inherit}
.fk-faq *,.fk-faq *::before,.fk-faq *::after{box-sizing:border-box}
.fk-faq .fk-faq__head{text-align:center;margin:0 0 40px}
.fk-faq .fk-faq__head .fk-faq__title,.fk-faq .fk-faq__head h2{font-size:clamp(16px,2vw,24px);font-weight:700;color:var(--fk-ink);margin:0 0 12px;line-height:1.2}
.fk-faq .fk-faq__head p{font-size:16px;line-height:1.5;color:var(--fk-gray);margin:0}
.fk-faq .fk-faq__grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px;align-items:start}
.fk-faq .fk-faq__col,.fk-faq .fk-faq__list{display:flex;flex-direction:column;gap:16px}
.fk-faq .fk-faq__item{counter-increment:fkfaq;background:var(--fk-bg);border:1px solid var(--fk-line);border-radius:16px;margin:0;transition:box-shadow .25s ease,border-color .25s ease}
.fk-faq .fk-faq__item:hover,.fk-faq .fk-faq__item.is-open{border-color:var(--fk-line-2);box-shadow:0 4px 20px rgba(88,135,218,.08)}
.fk-faq .fk-faq__item .fk-faq__q{position:relative;display:flex;align-items:center;gap:20px;margin:0;padding:20px 64px 20px 24px;font-size:14px;line-height:1.4;color:var(--fk-ink);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.fk-faq .fk-faq__item .fk-faq__q::before{content:counter(fkfaq);flex:0 0 44px;height:44px;border-radius:50%;background:var(--fk-tint);color:var(--fk-blue);display:grid;place-items:center;font-size:14px;line-height:1}
.fk-faq .fk-faq__item .fk-faq__q::after{content:"";position:absolute;right:24px;top:50%;width:20px;height:20px;margin-top:-10px;background:linear-gradient(var(--fk-blue),var(--fk-blue)) center/100% 2px no-repeat,linear-gradient(var(--fk-blue),var(--fk-blue)) center/2px 100% no-repeat;transition:transform .25s ease}
.fk-faq .fk-faq__item.is-open .fk-faq__q::after{background:linear-gradient(var(--fk-blue),var(--fk-blue)) center/100% 2px no-repeat;transform:rotate(180deg)}
.fk-faq .fk-faq__item .fk-faq__q:focus-visible{outline:2px solid var(--fk-blue);outline-offset:2px;border-radius:16px}
.fk-faq .fk-faq__a{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}
.fk-faq .fk-faq__item.is-open .fk-faq__a{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease}
.fk-faq .fk-faq__ab{overflow:hidden;min-height:0;padding:0 28px 0 36px;color:var(--fk-gray);font-size:12px;line-height:1.75}
.fk-faq .fk-faq__ab::after{content:"";display:block;height:24px}
.fk-faq .fk-faq__ab p{margin:0 0 8px;color:inherit;font-size:12px;line-height:inherit}
.fk-faq .fk-faq__ab ul,.fk-faq .fk-faq__ab ol{margin:0 0 8px;padding-left:20px}
.fk-faq .fk-faq__ab li{margin-bottom:2px;list-style:disc}
.fk-faq .fk-faq__ab>:last-child{margin-bottom:0}
.fk-faq .fk-faq__ab a{color:var(--fk-blue)}

/* ===== Kategori SEO alanı (dar container) ===== */
.fk-cat-seo{max-width:880px;margin:56px auto;padding:0 20px;box-sizing:border-box;font-family:inherit;color:var(--fk-text)}
.fk-cat-seo *,.fk-cat-seo *::before,.fk-cat-seo *::after{box-sizing:border-box}
.fk-cat-seo .fk-cat-seo__body{position:relative;font-size:14px;line-height:1.8;color:var(--fk-text)}
.fk-cat-seo .fk-cat-seo__body h1,.fk-cat-seo .fk-cat-seo__body h2,.fk-cat-seo .fk-cat-seo__body h3,.fk-cat-seo .fk-cat-seo__body h4{color:var(--fk-ink);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:32px 0 10px}
.fk-cat-seo .fk-cat-seo__body h1{font-size:24px}
.fk-cat-seo .fk-cat-seo__body h2{font-size:20px}
.fk-cat-seo .fk-cat-seo__body h3{font-size:16px;margin-top:24px}
.fk-cat-seo .fk-cat-seo__body h4{font-size:14px;margin-top:20px}
.fk-cat-seo .fk-cat-seo__body>:first-child{margin-top:0}
.fk-cat-seo .fk-cat-seo__body p{margin:0 0 14px;font-size:inherit;line-height:inherit;color:inherit}
.fk-cat-seo .fk-cat-seo__body ul,.fk-cat-seo .fk-cat-seo__body ol{margin:0 0 14px;padding-left:22px}
.fk-cat-seo .fk-cat-seo__body li{margin-bottom:4px;list-style:disc}
.fk-cat-seo .fk-cat-seo__body ol li{list-style:decimal}
.fk-cat-seo .fk-cat-seo__body li::marker{color:var(--fk-blue)}
.fk-cat-seo .fk-cat-seo__body strong{color:var(--fk-ink);font-weight:600}
.fk-cat-seo .fk-cat-seo__body a{color:var(--fk-blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;transition:color .2s}
.fk-cat-seo .fk-cat-seo__body a:hover{color:var(--fk-blue-d)}
.fk-cat-seo .fk-cat-seo__body>:last-child{margin-bottom:0}

/* Devamını oku */
.fk-cat-seo.is-clamped .fk-cat-seo__body{overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.fk-cat-seo.is-clamped .fk-cat-seo__body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--fk-bg) 85%);pointer-events:none;transition:opacity .35s ease}
.fk-cat-seo.is-expanded .fk-cat-seo__body::after{opacity:0}
.fk-cat-seo .fk-cat-seo__more{display:flex;align-items:center;gap:10px;margin:18px auto 0;padding:10px 20px;border:1px solid var(--fk-line);border-radius:999px;background:var(--fk-bg);color:var(--fk-blue);font:inherit;font-size:13px;font-weight:600;line-height:1.2;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s}
.fk-cat-seo .fk-cat-seo__more:hover{background:var(--fk-tint);border-color:var(--fk-line-2);box-shadow:0 4px 14px rgba(88,135,218,.10)}
.fk-cat-seo .fk-cat-seo__more:focus-visible{outline:2px solid var(--fk-blue);outline-offset:2px}
.fk-cat-seo .fk-cat-seo__more::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .3s ease}
.fk-cat-seo.is-expanded .fk-cat-seo__more::after{transform:translateY(2px) rotate(-135deg)}

/* Kategori içindeki SSS: tek kolon, container genişliğinde */
.fk-cat-seo .fk-faq{max-width:none;margin:48px 0 0;padding:0}
.fk-cat-seo .fk-faq .fk-faq__head{margin-bottom:28px}
.fk-cat-seo .fk-faq .fk-faq__list{gap:12px}

@media (max-width:991px){
  .fk-faq .fk-faq__grid{grid-template-columns:1fr;gap:12px}
  .fk-faq .fk-faq__col,.fk-faq .fk-faq__list{gap:12px}
}
@media (max-width:575px){
  .fk-faq{margin:32px auto}
  .fk-faq .fk-faq__head{margin-bottom:24px}
  .fk-faq .fk-faq__head p{font-size:14px}
  .fk-faq .fk-faq__item .fk-faq__q{gap:14px;padding:16px 48px 16px 16px;font-size:15px}
  .fk-faq .fk-faq__item .fk-faq__q::before{flex-basis:36px;height:36px;font-size:14px}
  .fk-faq .fk-faq__item .fk-faq__q::after{right:16px;width:16px;height:16px;margin-top:-8px}
  .fk-faq .fk-faq__ab{padding:0 16px;font-size:14px}
  .fk-faq .fk-faq__ab::after{height:18px}
  .fk-cat-seo{margin:40px auto;padding:0 16px}
  .fk-cat-seo .fk-cat-seo__body h1{font-size:20px}
  .fk-cat-seo .fk-cat-seo__body h2{font-size:18px}
  .fk-cat-seo .fk-cat-seo__body h3{font-size:15px}
  .fk-cat-seo .fk-faq{margin-top:36px}
}
@media (prefers-reduced-motion:reduce){
  .fk-faq *,.fk-cat-seo *{transition:none!important}
}

.pv .fk-faq{margin-top:24px}
</style>
</head>
<body>

<header class="top">
  <div class="top-l">
    <h1>SEO içerik oluşturucu</h1>
    <div class="seg" role="group" aria-label="Sayfa türü">
      <button type="button" data-mode="pdp" aria-pressed="true">Ürün sayfası SSS</button>
      <button type="button" data-mode="cat" aria-pressed="false">Kategori SEO alanı</button>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn" id="btnImport" type="button">Mevcut HTML'i içe aktar</button>
    <button class="btn btn-ghost" id="btnReset" type="button">Formu temizle</button>
  </div>
</header>

<main class="layout">
  <section class="form" id="form" aria-label="İçerik"></section>

  <section class="out" aria-label="Çıktı">
    <div class="seg" role="group" aria-label="Görünüm">
      <button type="button" data-tab="preview" aria-pressed="true">Önizleme</button>
      <button type="button" data-tab="code" aria-pressed="false">HTML çıktısı</button>
      <button type="button" data-tab="outline" aria-pressed="false">Başlık yapısı<span class="badge" id="oBadge" hidden></span></button>
    </div>
    <div class="pane" id="pane-preview"><div class="pane-scroll"><div class="pv" id="preview"></div></div></div>
    <div class="pane" id="pane-code" hidden>
      <pre class="code" id="code"></pre>
      <div class="code-foot">
        <span class="status" id="status"></span>
        <button class="btn btn-primary" id="btnCopy" type="button">HTML'i kopyala</button>
      </div>
    </div>
    <div class="pane" id="pane-outline" hidden><div class="outline" id="outline"></div></div>
  </section>
</main>

<dialog id="dlgImport">
  <div class="dlg">
    <h2>Mevcut HTML'i içe aktar</h2>
    <p>Ek Bilgi 4 veya kategori SEO alanındaki HTML'i yapıştır. Tür otomatik algılanır, form bu içerikle dolar.</p>
    <textarea id="impText" spellcheck="false"></textarea>
    <div class="dlg-err" id="impErr"></div>
    <div class="dlg-foot">
      <button class="btn btn-ghost" type="button" id="impCancel">Vazgeç</button>
      <button class="btn btn-primary" type="button" id="impOk">İçe aktar</button>
    </div>
  </div>
</dialog>

<script>
(function () {
  var CLAMP = 320; // kısaltılmış SEO metni yüksekliği (px)
  var SLACK = 120; // metin CLAMP + bu değerden kısaysa kısaltma yapılmaz
  var uid = 0;

  function prepFaq() {
    document.querySelectorAll('.fk-faq__q:not([role])').forEach(function (q) {
      var item = q.closest('.fk-faq__item'); if (!item) return;
      q.setAttribute('role', 'button');
      q.setAttribute('tabindex', '0');
      q.setAttribute('aria-expanded', item.classList.contains('is-open'));
    });
  }

  function toggleFaq(q) {
    var item = q.closest('.fk-faq__item'); if (!item) return;
    var open = !item.classList.contains('is-open');
    item.classList.toggle('is-open', open);
    q.setAttribute('aria-expanded', open);
  }

  function prepClamp() {
    document.querySelectorAll('.fk-cat-seo--clamp:not([data-fk-clamp])').forEach(function (sec) {
      var body = sec.querySelector('.fk-cat-seo__body'); if (!body) return;
      sec.setAttribute('data-fk-clamp', '1');
      if (body.scrollHeight <= CLAMP + SLACK) return;
      if (!body.id) body.id = 'fkseo' + (++uid);
      sec.classList.add('is-clamped');
      body.style.maxHeight = CLAMP + 'px';
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fk-cat-seo__more';
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-controls', body.id);
      btn.innerHTML = '<span>Devamını oku</span>';
      body.parentNode.insertBefore(btn, body.nextSibling);
    });
  }

  function toggleClamp(btn) {
    var sec = btn.closest('.fk-cat-seo'), body = sec && sec.querySelector('.fk-cat-seo__body');
    if (!body) return;
    var label = btn.querySelector('span') || btn;
    if (!sec.classList.contains('is-expanded')) {
      sec.classList.add('is-expanded');
      body.style.maxHeight = body.scrollHeight + 'px';
      btn.setAttribute('aria-expanded', 'true');
      label.textContent = 'Daha az göster';
      var done = function (e) {
        if (e.target !== body) return;
        if (sec.classList.contains('is-expanded')) body.style.maxHeight = 'none';
        body.removeEventListener('transitionend', done);
      };
      body.addEventListener('transitionend', done);
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.offsetHeight; // reflow: animasyon 'none' değerinden başlayabilsin
      sec.classList.remove('is-expanded');
      body.style.maxHeight = CLAMP + 'px';
      btn.setAttribute('aria-expanded', 'false');
      label.textContent = 'Devamını oku';
      if (sec.getBoundingClientRect().top < 0) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function init() { prepFaq(); prepClamp(); }
  window.fkSeoInit = init;

  if (!window.__fkSeo) {
    window.__fkSeo = true;
    document.addEventListener('click', function (e) {
      if (!e.target.closest) return;
      var more = e.target.closest('.fk-cat-seo__more');
      if (more) { toggleClamp(more); return; }
      if (e.target.closest('.fk-faq__ab a')) return;
      var q = e.target.closest('.fk-faq__q');
      if (q) toggleFaq(q);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var q = e.target.closest && e.target.closest('.fk-faq__q');
      if (q) { e.preventDefault(); toggleFaq(q); }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.addEventListener('load', init);
})();

</script>
<script>
(function(){
  var KEY='fkSeoGen:v3';
  var ICON={
    up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>',
    down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
    del:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M5 4.5l.6 8.5h4.8l.6-8.5"/></svg>'
  };
  function emptyFaq(){ return {title:'',titleTag:'h2',desc:'',product:'',qTag:'h3',items:[{q:'',a:''}]}; }
  function emptyState(){ return {mode:'pdp',pdp:{faq:emptyFaq()},cat:{clamp:true,blocks:[{tag:'h2',title:'',body:''}],faq:emptyFaq()}}; }

  var state=null;
  try{ state=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!state||!state.pdp||!state.cat){
    state=emptyState();
    try{ // eski sürümden taşı
      var old=JSON.parse(localStorage.getItem('fkFaqGen:v2'));
      if(old&&Array.isArray(old.items)&&old.items.some(function(i){return i.q||i.a;})){
        var f=state.pdp.faq; f.title=old.title||''; f.desc=old.desc||''; f.product=old.product||''; f.items=old.items;
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
  function M(){ return state[state.mode]; }
  function F(){ return M().faq; }

  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function inline(s){
    s=esc(s);
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^\s)]+)\)/g,'<a href="$2">$1</a>');
    return s;
  }
  function richHtml(text){
    var out=[];
    String(text).replace(/\r/g,'').split(/\n\s*\n/).forEach(function(block){
      var lines=block.split('\n').map(function(l){return l.trim();}).filter(Boolean), para=[], ul=[], ol=[];
      function fp(){ if(para.length){ out.push('<p>'+para.map(inline).join('<br>')+'</p>'); para=[]; } }
      function fu(){ if(ul.length){ out.push('<ul>'+ul.map(function(l){return '<li>'+inline(l)+'</li>';}).join('')+'</ul>'); ul=[]; } }
      function fo(){ if(ol.length){ out.push('<ol>'+ol.map(function(l){return '<li>'+inline(l)+'</li>';}).join('')+'</ol>'); ol=[]; } }
      lines.forEach(function(l){
        var m=l.match(/^[-•*]\s+(.*)$/), n=l.match(/^\d+[.)-]\s+(.*)$/);
        if(m){ fp(); fo(); ul.push(m[1]); }
        else if(n){ fp(); fu(); ol.push(n[1]); }
        else { fu(); fo(); para.push(l); }
      });
      fp(); fu(); fo();
    });
    return out;
  }

  /* ---------- Çıktı ---------- */
  function validItems(f){ return f.items.filter(function(it){ return it.q.trim()&&it.a.trim(); }); }
  function buildFaq(f,layout){
    var items=validItems(f); if(!items.length) return '';
    var tt=f.titleTag||'h2', qt=f.qTag||'h3', L=[];
    L.push('<div class="fk-faq fk-faq--'+layout+' is-ready" itemscope itemtype="https://schema.org/FAQPage">');
    if(f.title.trim()||f.desc.trim()){
      L.push('<div class="fk-faq__head">');
      if(f.title.trim()) L.push('<'+tt+' class="fk-faq__title">'+esc(f.title.trim())+'</'+tt+'>');
      if(f.desc.trim()) L.push('<p>'+esc(f.desc.trim())+'</p>');
      L.push('</div>');
    }
    function item(it,open){
      L.push('');
      L.push('<div class="fk-faq__item'+(open?' is-open':'')+'" itemscope itemprop="mainEntity" itemtype="https://schema.org/Question">');
      L.push('<'+qt+' class="fk-faq__q" itemprop="name">'+esc(it.q.trim())+'</'+qt+'>');
      L.push('<div class="fk-faq__a" itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer">');
      L.push('<div class="fk-faq__ab" itemprop="text">');
      L.push(richHtml(it.a).join('\n'));
      L.push('</div>');
      L.push('</div>');
      L.push('</div>');
    }
    if(layout==='grid'){
      var half=Math.ceil(items.length/2);
      L.push('<div class="fk-faq__grid">');
      [items.slice(0,half),items.slice(half)].forEach(function(col,ci){
        if(!col.length) return;
        L.push('<div class="fk-faq__col">');
        col.forEach(function(it,i){ item(it,ci===0&&i===0); });
        L.push('</div>');
      });
      L.push('</div>');
    } else {
      L.push('<div class="fk-faq__list">');
      items.forEach(function(it,i){ item(it,i===0); });
      L.push('</div>');
    }
    L.push('</div>');
    return L.join('\n');
  }
  function validBlocks(){ return state.cat.blocks.filter(function(b){ return b.title.trim()||b.body.trim(); }); }
  function buildOutput(){
    if(state.mode==='pdp') return buildFaq(state.pdp.faq,'grid');
    var c=state.cat, blocks=validBlocks(), faq=buildFaq(c.faq,'list');
    if(!blocks.length&&!faq) return '';
    var L=['<section class="fk-cat-seo'+(c.clamp?' fk-cat-seo--clamp':'')+'">'];
    if(blocks.length){
      L.push('<div class="fk-cat-seo__body">');
      blocks.forEach(function(b){
        if(b.tag!=='none'&&b.title.trim()) L.push('<'+b.tag+'>'+esc(b.title.trim())+'</'+b.tag+'>');
        if(b.body.trim()) L.push(richHtml(b.body).join('\n'));
      });
      L.push('</div>');
    }
    if(faq){ L.push(''); L.push(faq); }
    L.push('</section>');
    return L.join('\n');
  }

  /* ---------- Uyarılar ---------- */
  function norm(s){ return s.toLocaleLowerCase('tr-TR'); }
  function itemWarns(it){
    var w=[], q=it.q.trim(), a=it.a.trim(), p=F().product.trim();
    if(!q&&!a) return w;
    if(!q) w.push('Soru boş, bu madde çıktıya girmeyecek.');
    if(!a){ w.push('Cevap boş, bu madde çıktıya girmeyecek.'); return w; }
    if(p&&q&&norm(q).indexOf(norm(p))===-1) w.push('Soruda "'+p+'" geçmiyor.');
    if(/yukarıda|aşağıda|teknik özellik|inceleyebilirsiniz|sayfamız/i.test(a)) w.push('Cevap sayfanın başka bir yerine yönlendiriyor. Bilgiyi doğrudan yaz ki tek başına alıntılanabilsin.');
    if(/(mi|mı|mu|mü)\?$/i.test(q)&&!/^(evet|hayır)/i.test(a)) w.push('Evet/hayır sorusu: cevaba "Evet" ya da "Hayır" ile başla.');
    if(/(süre|saat|dakika|kaç|ne kadar|kapasite|ağırlık|garanti)/i.test(q)&&!/\d/.test(a)) w.push('Soru sayısal bilgi soruyor ama cevapta rakam yok.');
    if(a.length>600) w.push('Cevap uzun ('+a.length+' karakter). İlk cümleyi net cevap yapıp kısaltmayı düşün.');
    return w;
  }
  function outlineData(html){
    var doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
    var hs=Array.prototype.map.call(doc.querySelectorAll('h1,h2,h3,h4,h5,h6'),function(h){ return {lv:+h.tagName[1],t:h.textContent.trim()}; });
    var w=[], h1=hs.filter(function(h){return h.lv===1;}).length;
    if(h1>1) w.push('Bu içerikte '+h1+' tane H1 var. Bir sayfada tek H1 olmalı.');
    else if(h1===1) w.push(state.mode==='cat'
      ? 'H1 kullandın. Tema kategori adını zaten H1 olarak basıyorsa sayfada iki H1 olur. Kaynağa bakıp kontrol et.'
      : 'Ürün sayfasında H1 ürün adıdır. SSS içinde H1 kullanma.');
    for(var i=1;i<hs.length;i++){
      if(hs[i].lv>hs[i-1].lv+1) w.push('"'+hs[i-1].t+'" (H'+hs[i-1].lv+') sonrasında "'+hs[i].t+'" H'+hs[i].lv+' olmuş, H'+(hs[i-1].lv+1)+' atlanmış.');
    }
    var f=F();
    if(validItems(f).length&&f.title.trim()&&+f.qTag[1]<=+f.titleTag[1]) w.push('SSS soruları ('+f.qTag.toUpperCase()+') SSS başlığından ('+f.titleTag.toUpperCase()+') bir alt seviyede olmalı.');
    if(hs.length&&hs[0].lv>2&&state.mode==='cat') w.push('İçerik H'+hs[0].lv+' ile başlıyor. Kategori H1\'inden sonra ilk başlık genellikle H2 olur.');
    return {hs:hs,w:w};
  }

  /* ---------- Form ---------- */
  function opt(v,cur,label){ return '<option value="'+v+'"'+(v===cur?' selected':'')+'>'+label+'</option>'; }
  function tagSelect(path,cur,allowed,aria){
    return '<select data-f="'+path+'" aria-label="'+aria+'">'+allowed.map(function(t){ return opt(t,cur,t==='none'?'Başlık yok':t.toUpperCase()); }).join('')+'</select>';
  }
  function tools(i,len){
    return '<div class="tools">'+
      '<button type="button" class="icon-btn" data-act="up" aria-label="Yukarı taşı"'+(i===0?' disabled':'')+'>'+ICON.up+'</button>'+
      '<button type="button" class="icon-btn" data-act="down" aria-label="Aşağı taşı"'+(i===len-1?' disabled':'')+'>'+ICON.down+'</button>'+
      '<button type="button" class="icon-btn del" data-act="del" aria-label="Sil">'+ICON.del+'</button></div>';
  }
  function renderForm(){
    var f=F(), cat=state.mode==='cat', h='';
    if(cat){
      var c=state.cat;
      h+='<div class="block"><div class="block-head"><h2>SEO yazısı</h2><span class="count">'+c.blocks.length+' bölüm</span></div>'+
        '<p class="hint">Her bölüm bir başlık ve altındaki metinden oluşur, başlık seviyesini sen seçersin. Boş satır yeni paragraf açar. <code>- </code> madde işaretli, <code>1. </code> numaralı liste yapar. <code>**kalın**</code> ve <code>[metin](https://…)</code> desteklenir.</p>'+
        '<div class="list" data-list="blocks">';
      c.blocks.forEach(function(b,i){
        h+='<div class="card" data-i="'+i+'"><div class="card-top"><span class="num">'+(i+1)+'</span><div class="card-fields">'+
          '<div class="hrow">'+tagSelect('tag',b.tag,['h1','h2','h3','h4','none'],'Başlık seviyesi')+
          '<input type="text" data-k="title" placeholder="Bölüm başlığı" aria-label="Bölüm başlığı" value="'+esc(b.title)+'"></div>'+
          '<textarea data-k="body" placeholder="Bölüm metni" aria-label="Bölüm metni">'+esc(b.body)+'</textarea>'+
          '</div>'+tools(i,c.blocks.length)+'</div></div>';
      });
      h+='</div><button class="add" type="button" data-add="blocks">+ Bölüm ekle</button>'+
        '<label class="check"><input type="checkbox" data-g="clamp"'+(c.clamp?' checked':'')+'> Uzun metni "Devamını oku" ile kısalt</label></div>';
    }
    h+='<div class="block"><h2>'+(cat?'SSS bölümü':'Bölüm başlığı')+'</h2><p class="hint">'+(cat?'Soru eklemezsen SSS bölümü çıktıya girmez.':'')+'</p>'+
      '<div class="row"><div class="field"><label for="fTitle">Başlık</label><input type="text" id="fTitle" data-q="title" placeholder="Sıkça Sorulan Sorular" value="'+esc(f.title)+'"></div>'+
      '<div class="field narrow"><label>Başlık etiketi</label>'+tagSelect('faq.titleTag',f.titleTag,['h1','h2','h3','h4'],'SSS başlık etiketi')+'</div></div>'+
      '<div class="row"><div class="field"><label for="fDesc">Açıklama</label><input type="text" id="fDesc" data-q="desc" placeholder="Kısa açıklama (opsiyonel)" value="'+esc(f.desc)+'"></div>'+
      '<div class="field narrow"><label>Soru etiketi</label>'+tagSelect('faq.qTag',f.qTag,['h2','h3','h4'],'Soru etiketi')+'</div></div>'+
      '<div class="row"><div class="field"><label for="fProd">'+(cat?'Kategori adı':'Ürün adı')+' (çıktıya girmez, kontrol için)</label><input type="text" id="fProd" data-q="product" placeholder="'+(cat?'Dikey süpürge':'Vion Flex')+'" value="'+esc(f.product)+'"></div></div></div>';

    h+='<div class="block"><div class="block-head"><h2>Sorular</h2><span class="count">'+f.items.length+' soru</span></div>'+
      '<p class="hint">Cevapta aynı biçimlendirme geçerli: boş satır, <code>- </code> liste, <code>**kalın**</code>, <code>[metin](link)</code>.</p><div class="list" data-list="items">';
    f.items.forEach(function(it,i){
      h+='<div class="card" data-i="'+i+'"><div class="card-top"><span class="num">'+(i+1)+'</span><div class="card-fields">'+
        '<input type="text" data-k="q" placeholder="Soru" aria-label="Soru '+(i+1)+'" value="'+esc(it.q)+'">'+
        '<textarea data-k="a" placeholder="Cevap. İlk cümle doğrudan cevap olsun, rakam ve birimle." aria-label="Cevap '+(i+1)+'">'+esc(it.a)+'</textarea>'+
        '</div>'+tools(i,f.items.length)+'</div><ul class="warns"></ul></div>';
    });
    h+='</div><button class="add" type="button" data-add="items">+ Soru ekle</button></div>';
    $('form').innerHTML=h;
    refreshWarns();
  }
  function listArr(name){ return name==='blocks'?state.cat.blocks:F().items; }
  function refreshWarns(){
    document.querySelectorAll('[data-list="items"] .card').forEach(function(card){
      var it=F().items[+card.dataset.i]; if(!it) return;
      card.querySelector('.warns').innerHTML=itemWarns(it).map(function(w){return '<li>'+esc(w)+'</li>';}).join('');
    });
  }

  var form=$('form');
  form.addEventListener('input',function(e){
    var t=e.target;
    if(t.dataset.q){ F()[t.dataset.q]=t.value; if(t.dataset.q==='product') refreshWarns(); update(); return; }
    if(t.dataset.k){
      var card=t.closest('.card'), arr=listArr(card.closest('.list').dataset.list), o=arr[+card.dataset.i];
      o[t.dataset.k]=t.value;
      if(card.closest('[data-list="items"]')){ card.querySelector('.warns').innerHTML=itemWarns(o).map(function(w){return '<li>'+esc(w)+'</li>';}).join(''); }
      update();
    }
  });
  form.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset.g==='clamp'){ state.cat.clamp=t.checked; update(); return; }
    if(t.dataset.f){
      if(t.dataset.f==='faq.titleTag') F().titleTag=t.value;
      else if(t.dataset.f==='faq.qTag') F().qTag=t.value;
      else if(t.dataset.f==='tag'){ var card=t.closest('.card'); state.cat.blocks[+card.dataset.i].tag=t.value; }
      update();
    }
  });
  form.addEventListener('click',function(e){
    var add=e.target.closest('[data-add]');
    if(add){
      var name=add.dataset.add;
      listArr(name).push(name==='blocks'?{tag:'h2',title:'',body:''}:{q:'',a:''});
      renderForm(); update();
      var lists=form.querySelectorAll('[data-list="'+name+'"] .card'), last=lists[lists.length-1];
      if(last){ last.querySelector('input').focus(); last.scrollIntoView({block:'nearest',behavior:'smooth'}); }
      return;
    }
    var b=e.target.closest('[data-act]'); if(!b) return;
    var card=b.closest('.card'), arr=listArr(card.closest('.list').dataset.list), i=+card.dataset.i, act=b.dataset.act;
    if(act==='del'){
      var o=arr[i], filled=Object.keys(o).some(function(k){ return k!=='tag'&&String(o[k]).trim(); });
      if(filled&&!confirm('Silinsin mi?')) return;
      arr.splice(i,1);
      if(!arr.length) arr.push(card.closest('[data-list="blocks"]')?{tag:'h2',title:'',body:''}:{q:'',a:''});
    }
    if(act==='up'&&i>0){ var t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t; }
    if(act==='down'&&i<arr.length-1){ var t2=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t2; }
    renderForm(); update();
  });

  /* ---------- Güncelle ---------- */
  function update(){
    var html=buildOutput();
    $('code').textContent=html||'<!-- Henüz içerik yok -->';
    var pv=$('preview');
    pv.innerHTML=html||'<div class="pv-empty">'+(state.mode==='cat'?'Bir bölüm metni ya da cevaplı bir soru yazdığında önizleme burada görünür.':'En az bir soruya cevap yazdığında önizleme burada görünür.')+'</div>';
    if(window.fkSeoInit) window.fkSeoInit();

    var f=F(), n=validItems(f).length;
    var st=(state.mode==='cat'?'<b>'+validBlocks().length+'</b> bölüm · ':'')+'<b>'+n+'</b> / '+f.items.length+' soru çıktıda · '+html.length.toLocaleString('tr-TR')+' karakter';
    $('status').innerHTML=st;

    var od=outlineData(html), o='<h3>Başlık hiyerarşisi</h3>';
    o+=od.hs.length?'<ul class="ol">'+od.hs.map(function(h){ return '<li style="padding-left:'+((h.lv-1)*18)+'px"><span class="tag h'+h.lv+'">H'+h.lv+'</span><span>'+esc(h.t)+'</span></li>'; }).join('')+'</ul>':'<p class="ol-empty">Henüz başlık yok.</p>';
    o+='<h3>Kontrol</h3><ul class="owarn">'+(od.w.length?od.w.map(function(w){return '<li>'+esc(w)+'</li>';}).join(''):'<li class="ok">Başlık yapısında sorun görünmüyor.</li>')+'</ul>';
    $('outline').innerHTML=o;
    var bd=$('oBadge'); bd.hidden=!od.w.length; bd.textContent=od.w.length;
    save();
  }

  /* ---------- Mod / sekmeler ---------- */
  function setMode(m){
    state.mode=m;
    document.querySelectorAll('[data-mode]').forEach(function(x){ x.setAttribute('aria-pressed',x.dataset.mode===m); });
    renderForm(); update();
  }
  document.querySelectorAll('[data-mode]').forEach(function(b){ b.addEventListener('click',function(){ setMode(b.dataset.mode); }); });
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('[data-tab]').forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
      ['preview','code','outline'].forEach(function(t){ $('pane-'+t).hidden=b.dataset.tab!==t; });
    });
  });

  /* ---------- Kopyala ---------- */
  $('btnCopy').addEventListener('click',function(){
    var text=buildOutput(), btn=this;
    if(!text) return;
    function done(){ btn.textContent='Kopyalandı'; btn.classList.add('copied'); setTimeout(function(){ btn.textContent="HTML'i kopyala"; btn.classList.remove('copied'); },1600); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ alert('Kopyalanamadı, metni elle seç.'); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fallback); else fallback();
  });

  /* ---------- İçe aktar ---------- */
  function nodeText(n){
    var s='';
    n.childNodes.forEach(function(c){
      if(c.nodeType===3) s+=c.textContent.replace(/\s+/g,' ');
      else if(c.nodeType===1){
        var t=c.tagName;
        if(t==='BR') s+='\n';
        else if(t==='STRONG'||t==='B') s+='**'+nodeText(c).trim()+'**';
        else if(t==='A') s+='['+nodeText(c).trim()+']('+(c.getAttribute('href')||'')+')';
        else s+=nodeText(c);
      }
    });
    return s;
  }
  function richText(container){
    var out=[];
    (function walk(el){
      Array.prototype.forEach.call(el.children,function(c){
        var t=c.tagName;
        if(t==='P') out.push(nodeText(c).split('\n').map(function(l){return l.trim();}).join('\n').trim());
        else if(t==='UL') out.push(Array.prototype.map.call(c.querySelectorAll('li'),function(li){ return '- '+nodeText(li).trim(); }).join('\n'));
        else if(t==='OL') out.push(Array.prototype.map.call(c.querySelectorAll('li'),function(li,i){ return (i+1)+'. '+nodeText(li).trim(); }).join('\n'));
        else if(t==='DIV') walk(c);
        else if(c.textContent.trim()) out.push(nodeText(c).trim());
      });
    })(container);
    if(!out.length&&container.textContent.trim()) out.push(container.textContent.trim());
    return out.filter(Boolean).join('\n\n');
  }
  function lower(el){ return el.tagName.toLowerCase(); }
  function parseFaq(faqEl){
    var f=emptyFaq(); f.items=[];
    var blocks=faqEl.querySelectorAll('[itemprop="mainEntity"]');
    if(blocks.length){
      blocks.forEach(function(b){
        var q=b.querySelector('[itemprop="name"]'), a=b.querySelector('[itemprop="text"]')||b.querySelector('[itemprop="acceptedAnswer"]');
        if(!q) return;
        if(/^h[2-4]$/i.test(q.tagName)) f.qTag=lower(q);
        f.items.push({q:q.textContent.trim(),a:a?richText(a):''});
      });
      var th=faqEl.querySelector('.fk-faq__title')||Array.prototype.find.call(faqEl.querySelectorAll('h1,h2,h3,h4'),function(h){ return !h.closest('[itemprop="mainEntity"]'); });
      if(th){ f.title=th.textContent.trim(); if(/^h[1-4]$/i.test(th.tagName)) f.titleTag=lower(th); }
      var dp=faqEl.querySelector('.fk-faq__head p')||Array.prototype.find.call(faqEl.children,function(c){ return c.tagName==='P'; });
      if(dp) f.desc=dp.textContent.trim();
    } else {
      var r=faqEl; while(r.children.length===1&&r.firstElementChild.tagName==='DIV') r=r.firstElementChild;
      var cur=null, tmp=null;
      Array.prototype.forEach.call(r.children,function(c){
        if(c.tagName==='H2'){ f.title=c.textContent.trim(); return; }
        if(c.tagName==='H3'){ if(cur) cur.a=richText(tmp); tmp=document.createElement('div'); cur={q:c.textContent.trim(),a:''}; f.items.push(cur); return; }
        if(cur) tmp.appendChild(c.cloneNode(true));
        else if(!f.desc&&c.tagName==='P') f.desc=c.textContent.trim();
      });
      if(cur) cur.a=richText(tmp);
    }
    if(!f.items.length) f.items=[{q:'',a:''}];
    return f;
  }
  function parseBlocks(body){
    var out=[], cur=null, tmp=null;
    function close(){ if(cur){ cur.body=richText(tmp); out.push(cur); } }
    Array.prototype.forEach.call(body.children,function(c){
      if(/^H[1-4]$/.test(c.tagName)){ close(); cur={tag:lower(c),title:c.textContent.trim(),body:''}; tmp=document.createElement('div'); return; }
      if(!cur){ cur={tag:'none',title:'',body:''}; tmp=document.createElement('div'); }
      tmp.appendChild(c.cloneNode(true));
    });
    close();
    return out;
  }
  function importHtml(html){
    var doc=new DOMParser().parseFromString('<div id="r">'+html+'</div>','text/html'), r=doc.getElementById('r');
    var faqEl=r.querySelector('[itemtype*="FAQPage"]'), sec=r.querySelector('.fk-cat-seo'), body=r.querySelector('.fk-cat-seo__body');
    if(sec||body){
      var c=state.cat;
      c.blocks=body?parseBlocks(body):[]; if(!c.blocks.length) c.blocks=[{tag:'h2',title:'',body:''}];
      c.faq=faqEl?parseFaq(faqEl):emptyFaq();
      c.clamp=sec?sec.classList.contains('fk-cat-seo--clamp'):true;
      state.mode='cat';
      return true;
    }
    var f=parseFaq(faqEl||r);
    if(!f.items.some(function(i){return i.q;})) return false;
    state.pdp.faq=f; state.mode='pdp';
    return true;
  }
  var dlg=$('dlgImport');
  $('btnImport').addEventListener('click',function(){ $('impErr').textContent=''; $('impText').value=''; dlg.showModal(); $('impText').focus(); });
  $('impCancel').addEventListener('click',function(){ dlg.close(); });
  $('impOk').addEventListener('click',function(){
    var v=$('impText').value.trim();
    if(!v){ $('impErr').textContent='Önce HTML yapıştır.'; return; }
    if(!importHtml(v)){ $('impErr').textContent='Tanınan bir içerik bulunamadı.'; return; }
    dlg.close(); setMode(state.mode);
  });
  $('btnReset').addEventListener('click',function(){
    if(!confirm('Bu sekmedeki tüm içerik silinsin mi?')) return;
    if(state.mode==='cat') state.cat={clamp:true,blocks:[{tag:'h2',title:'',body:''}],faq:emptyFaq()};
    else state.pdp={faq:emptyFaq()};
    setMode(state.mode);
  });

  setMode(state.mode||'pdp');
})();
</script>
